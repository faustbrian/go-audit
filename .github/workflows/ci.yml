name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Run the stable release rehearsal
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: faustbrian/go-library-tools/.github/workflows/library-ci.yml@0e8ff6fee42e88858069a6f6ae6f1080d95c5eae # v2.4.0
    with:
      tooling_sha: 0e8ff6fee42e88858069a6f6ae6f1080d95c5eae
      source_bootstrap: false
      source_documentation: check
      public_dependencies: true
      release_dry_run: ${{ inputs.release_dry_run || false }}
      release_module: ${{ inputs.release_dry_run && '.' || '' }}

  documentation-claims:
    name: Documentation and audit claims
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Check out exact producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check documentation structure and claim refusals
        run: bash scripts/check-docs.sh --local

  required:
    name: Required
    if: always()
    needs: [ci, documentation-claims]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require shared workflow and audit documentation boundary
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DOCS_RESULT: ${{ needs.documentation-claims.result }}
        run: test "${CI_RESULT}" = success && test "${DOCS_RESULT}" = success
