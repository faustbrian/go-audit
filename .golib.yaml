schema_version: 1
tool_version: v2.5.1
tool_checksums_sha256: ca1293ba633e3ebb5197134cd586979db4e0af51a37e0de0bad2884005327c15
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
  - module: .
    archive: .verification/mutation/bootstrap/root.zip
    ledger: .verification/mutation/migration-ledger.json
  - module: postgres
    archive: .verification/mutation/bootstrap/postgres.zip
    ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
  - module: .
    mode: apidiff
    path: api/v2.txt
  - module: postgres
    mode: apidiff
    path: postgres/api/baseline.txt
operations:
- module: .
  gate: local-test
  steps:
  - type: go-test
    packages: ["./memory"]
    run: '^Test(AppendCancellationWhileWaitingForStoreLockReturnsPromptly|QueryCancellationWhileWaitingForStoreLockReturnsPromptly)$'
    count: 1
    race: true
    timeout: 2m
- module: .
  gate: test
  steps:
  - type: go-test
    packages: ["./memory"]
    run: '^TestStoreConcurrentDuplicateStressIsBoundedAndIdempotent$'
    count: 100
    timeout: 20m
  - type: go-test
    packages: ["./memory"]
    run: '^TestStoreLargeTenantHighCardinalitySoakRemainsBounded$'
    count: 25
    timeout: 20m
  - type: make
    makefile: verification/package.mk
    target: clean-consumer
    timeout: 20m
- module: postgres
  gate: test
  steps:
  - type: go-test
    packages: ["."]
    run: '^TestPostgreSQLAppendQueryIdempotencyAndWriterPrivileges$'
    count: 1
    timeout: 20m
- module: .
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: .
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzCanonicalRecord$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzHostileRecordConstruction$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzCursor$'
    budget: 10000x
    timeout: 2m
- module: postgres
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzConfigBatchBoundary$'
    budget: 10000x
    timeout: 2m
- module: .
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
- module: postgres
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
