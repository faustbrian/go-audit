schema_version: 1
tool_version: v1.4.0
tool_checksums_sha256: ba1b71d41dc9b58d5bfb411bc89ae2d45b6f3f778152714bfd1afeab0bef2f33
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
  - module: .
    archive: .verification/mutation/bootstrap/root.zip
    ledger: .verification/mutation/migration-ledger.json
  - module: postgres
    archive: .verification/mutation/bootstrap/postgres.zip
    ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
  - module: .
    mode: apidiff
    path: api/baseline.txt
  - module: postgres
    mode: apidiff
    path: postgres/api/baseline.txt
operations:
- module: .
  gate: test
  steps:
  - type: go-test
    packages: ["./memory"]
    run: '^TestStoreConcurrentDuplicateStressIsBoundedAndIdempotent$'
    count: 100
    timeout: 20m
  - type: go-test
    packages: ["./memory"]
    run: '^TestStoreLargeTenantHighCardinalitySoakRemainsBounded$'
    count: 25
    timeout: 20m
  - type: make
    makefile: verification/package.mk
    target: clean-consumer
    timeout: 20m
- module: postgres
  gate: test
  steps:
  - type: go-test
    packages: ["."]
    run: '^TestPostgreSQLAppendQueryIdempotencyAndWriterPrivileges$'
    count: 1
    timeout: 20m
- module: .
  gate: docs
  steps:
  - type: make
    makefile: verification/package.mk
    target: docs
    timeout: 20m
- module: .
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzCanonicalRecord$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzHostileRecordConstruction$'
    budget: 10000x
    timeout: 2m
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzCursor$'
    budget: 10000x
    timeout: 2m
- module: postgres
  gate: fuzz
  steps:
  - type: go-test
    packages: ["."]
    fuzz: '^FuzzConfigBatchBoundary$'
    budget: 10000x
    timeout: 2m
- module: .
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
- module: postgres
  gate: benchmark
  steps:
  - type: go-test
    packages: ["./..."]
    benchmark: "."
    budget: 100ms
    timeout: 20m
